    <div class="bdock" id="sfxdock">
      <div class="bhead" data-collapse="sfxdock">▾ SFX<button class="maxbtn" data-max="sfxdock" title="Maximize">⛶</button></div>
      <div class="bbody">
        <!-- 2.360.0 (Tim: "can you add a sfx docker, let user add video files, including .mov or audio files,
             extract audio from video files allow user to select section from the waveform and trim - give option
             to keep selected or delete selected"): the project's sound effects (projects/<p>/sfx, 48 kHz WAV).
             📂 adds audio or video (the audio is extracted); drag across the waveform to select; ✂ Keep selected
             leaves only the selection, 🗑 Delete selected cuts it out; ↶ Undo; → 🔊 copies it to the Sound
             assets (timeline, references). lib/sfx.js + routes/sfx.js. -->
        <div class="brow" style="gap:6px;align-items:end;flex-wrap:wrap">
          <label style="flex:1;min-width:160px">Sound effect
            <select id="sfxSel" title="This project's sound effects (projects/&lt;project&gt;/sfx)"></select></label>
          <button class="ghost gbtn" id="sfxAdd" type="button"
            title="Add audio or video files (.mov .mp4 .mkv .webm .avi ... / .wav .mp3 .flac .ogg .m4a ...) - a video's audio is extracted">📂 Add</button>
          <input type="file" id="sfxFile" class="hidden" multiple
            accept=".mov, .mp4, .m4v, .mkv, .webm, .avi, .wmv, .flv, .mpg, .mpeg, .3gp, .mts, .m2ts, .ts, .mxf, .wav, .mp3, .flac, .ogg, .m4a, .aac, .opus, .wma, .aif, .aiff">
          <button class="ghost gbtn" id="sfxRefresh" type="button" title="Re-read the sound effects">⟳</button>
          <button class="ghost gbtn" id="sfxToSound" type="button"
            title="Copy this sound effect into the project's Sound assets (the timeline and the references use those)">→ 🔊</button>
          <button class="ghost gbtn" id="sfxDel" type="button" title="Delete this sound effect">🗑</button>
        </div>
        <div class="brow" style="gap:6px;align-items:center;margin-top:6px">
          <button class="ghost gbtn" id="sfxPlay" type="button" title="Play the selection (or the whole sound when nothing is selected)">▶</button>
          <canvas id="sfxWave" height="64" style="flex:1;min-width:0;height:64px;cursor:crosshair;touch-action:none"
            aria-label="Waveform - drag to select a part" title="Click to seek - DRAG to select a part"></canvas>
          <button class="ghost gbtn" id="sfxZoomIn" type="button" title="Zoom in (on the selection)">🔍+</button>
          <button class="ghost gbtn" id="sfxZoomOut" type="button" title="Zoom out">🔍−</button>
          <button class="ghost gbtn" id="sfxZoomReset" type="button" title="The whole sound">⤢</button>
        </div>
        <div class="brow" style="gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">
          <!-- 2.361.0 (Tim: "allow user to choose duration and drag selection box of specified duration"):
               a Duration makes the selection a box of exactly that length - press on the waveform to drop it
               there, drag to slide it; blank = a free drag-select. Any selection can be slid by dragging it. -->
          <label class="hint" style="display:flex;gap:3px;align-items:center"
                 title="A fixed selection length: press on the waveform to drop a box of this many seconds, drag it to move it. Blank = drag to select any length.">Duration
            <input type="number" id="sfxDur" step="0.1" min="0.05" placeholder="free" style="width:62px" aria-label="Selection duration (seconds) - blank for a free selection"> s</label>
          <label class="hint" style="display:flex;gap:3px;align-items:center">Start
            <input type="number" id="sfxStart" step="0.01" min="0" style="width:70px" aria-label="Selection start (seconds)"></label>
          <label class="hint" style="display:flex;gap:3px;align-items:center">End
            <input type="number" id="sfxEnd" step="0.01" min="0" style="width:70px" aria-label="Selection end (seconds)"></label>
          <span class="hint" id="sfxLen"></span>
          <button class="ghost gbtn" id="sfxKeep" type="button" title="Keep only the selected part (the rest is removed)">✂ Keep selected</button>
          <button class="ghost gbtn" id="sfxCut" type="button" title="Delete the selected part (the two sides are joined)">🗑 Delete selected</button>
          <label class="hint" style="display:flex;gap:3px;align-items:center" title="Write the result as a new file (name_keep / name_cut) and leave this one as it is">
            <input type="checkbox" id="sfxAsNew">as a new file</label>
          <button class="ghost gbtn" id="sfxUndo" type="button" title="Undo the last cut of this sound">↶ Undo</button>
        </div>
        <div class="hint" id="sfxMsg" style="margin-top:6px">—</div>
        <!-- 2.621.0 (Tim: "in the sfx docker can you add an input that the user can copy/paste text, or get input from the llm or
             type custom text to create speech/dialog user can choose the voice/voices and the text will be read with emotion
             using omnivoice or ming voices. save formats will be wav or mp3 to save the read voice into assets-audio. The name
             of the file will be an input above the speech input, description will be below - it would be great if we can
             save the date,time,description and text in the files metadata"): ext/sfxdock/sfxspeech.js + routes/speechDialog.js
             + lib/speechDialog.js. -->
        <style>
          #spBox { margin-top: 10px; border-top: 1px solid var(--line, #444); padding-top: 6px; }
          #spBox summary { cursor: pointer; font-weight: 600; margin-bottom: 6px; }
          #spBox .brow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
          #spBox label.sp { display: flex; flex-direction: column; gap: 2px; font-size: 11px; }
          #spText { width: 100%; min-height: 120px; resize: vertical; font: 12px/1.45 var(--mono, monospace); box-sizing: border-box; }
          #spCast { display: grid; grid-template-columns: minmax(70px, auto) 1fr 1fr; gap: 3px 6px; align-items: center; font-size: 11px; margin: 4px 0; }
          #spCast .h { color: var(--dim, #999); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
          #spCast select { font-size: 11px; }
          #spMeta { white-space: pre-wrap; font-size: 11px; margin-top: 4px; }
        </style>
        <details id="spBox" open>
          <summary title="Text read aloud with emotion by OmniVoice or Ming-3.0 TTS - one voice or a cast - saved into the Audio assets">🗣 Speech &amp; dialog</summary>
          <label class="sp">File name
            <input type="text" id="spName" placeholder="e.g. intro_dialog" maxlength="80" title="The file's name in the Audio assets (.wav / .mp3 is added; an existing file is never overwritten - _2 is added)"></label>
          <div class="brow">
            <button class="ghost gbtn" id="spPaste" type="button" title="Paste the clipboard's text into the box (Ctrl+V in the box works too)">📋 Paste</button>
            <input type="text" id="spBrief" placeholder="✨ what should the LLM write? (e.g. two friends meet after years)" style="flex:1;min-width:160px" title="A short brief for the LLM - the speakers come from the Cast below, or it picks names">
            <button class="ghost gbtn" id="spWrite" type="button" title="The LLM writes the lines (Name (emotion): words) - it replaces the box's text (Ctrl+Z in the box brings it back)">✨ Write</button>
            <select id="spTag" title="Put a sound tag where the cursor is - OmniVoice reads them as sounds" aria-label="Sound tag"><option value="">＋ tag</option></select>
            <select id="spMode" title="Dialog: lines like  Anna (happy): Hello  are spoken by each speaker's voice. One voice: the whole text in the chosen voice" aria-label="How to read it">
              <option value="dialog">Dialog (Name: line)</option><option value="single">One voice reads it all</option></select>
            <button class="ghost gbtn" id="spClear" type="button" title="Empty the name, text and description">🧹</button>
          </div>
          <textarea id="spText" spellcheck="true" aria-label="The text to read" placeholder="Type, paste or ✨ write the words. A dialog - one line each:
Anna (happy): We made it! [laughter]
Ben (surprised): Already?
(sad) A line on its own takes an emotion like this. A blank line = a longer pause."></textarea>
          <label class="sp">Description
            <input type="text" id="spDesc" placeholder="what this is for - saved in the file's metadata" maxlength="2000"></label>
          <div class="brow">
            <label class="sp">Engine <select id="spEngine" aria-label="Speech engine"></select></label>
            <label class="sp">Voice <select id="spVoice" aria-label="Voice" title="The voice for a text without speakers, and for a speaker with no voice of their own"></select></label>
            <label class="sp">Emotion <select id="spEmo" aria-label="Emotion" title="The mood for lines that name none"></select></label>
            <label class="sp">Save as <select id="spFmt" aria-label="Format"><option value="wav">WAV</option><option value="mp3">MP3</option></select></label>
            <label class="sp">Pause (s) <input type="number" id="spPause" min="0" max="5" step="0.05" value="0.35" style="width:60px" title="Silence between lines (a blank line doubles it)"></label>
          </div>
          <div id="spCast" aria-label="The cast"></div>
          <div class="brow">
            <button id="spGo" type="button" title="Read it and save it into the project's Audio assets, with the date, time, description and text in the file">🗣 Read &amp; save to Audio</button>
            <span class="hint" id="spProg"></span>
          </div>
          <audio id="spPlay" controls preload="none" style="display:none;width:100%;margin-top:4px"></audio>
          <div class="hint" id="spMsg">—</div>
          <div class="hint" id="spMeta"></div>
        </details>
      </div>
    </div>
    <!-- the sfxdock's BOTTOM resize handle - drag it and THIS docker follows the mouse -->
    <div class="hsplit" data-hresize="sfh"></div>
