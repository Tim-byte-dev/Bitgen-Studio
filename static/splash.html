<!doctype html>
<!-- bitGen Studio — 2.701.0 (Tim: "can u make a splash screen with the video, but add produced and developed by Timothy Nolan Paul,
     programmed by claude opus 5.5 15seconds"): the desktop app's start-up splash - static/splash.webm (made by
     misc/intro/render.js --splash) while the studio starts behind it. A click or any key skips it; electron/main.js closes it after
     16.5 s whatever happens and shows the studio.
     2.726.0 (Tim: "use this as one of the starting images and change the theme to match"): ONE OF TWO at each start, at random -
     the film, or the bitGen brain picture (static/splash-neural.jpg, docs/images/bitgen-neural.jpg widened to 16:9) for 8 s with a
     slow push-in and the same credits. #film / #neural in the address picks one (the tests). -->
<html><head><meta charset="utf-8"><title>bitGen Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: pointer; -webkit-user-select: none; user-select: none; }
  body { -webkit-app-region: drag; }
  video, #pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #pic { display: none; opacity: 0; transform: scale(1); transform-origin: 50% 46%; }
  body.neural #pic { display: block; animation: in 1.1s ease-out forwards, push 8s linear forwards; }
  body.neural video { display: none; }
  @keyframes in { to { opacity: 1; } }
  @keyframes push { to { transform: scale(1.06); } }
  #cred { position: absolute; left: 0; right: 0; bottom: 5.5%; display: none; text-align: center; font: 300 clamp(11px, 1.45vw, 19px) "Segoe UI", system-ui, sans-serif; letter-spacing: .06em; color: #cfe2f6; opacity: 0; text-shadow: 0 1px 6px #000; }
  #cred div + div { margin-top: .45em; }
  #cred b { font-weight: 600; color: #fff; margin-left: .45em; }
  body.neural #cred { display: block; animation: in 1s ease-out 1.4s forwards; }
  #skip { position: absolute; right: 14px; bottom: 10px; font: 12px "Segoe UI", system-ui, sans-serif; color: rgba(242,237,228,.55); opacity: 0; transition: opacity .8s; -webkit-app-region: no-drag; }
  body.hint #skip { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { body.neural #pic { animation: in 1.1s ease-out forwards; } }
</style></head>
<body>
<video id="v" muted playsinline></video>
<img id="pic" alt="" src="splash-neural.jpg">
<div id="cred"><div>Produced and developed by<b>Timothy Nolan Paul</b></div><div>Programmed by<b>Claude Opus 5.5</b></div></div>
<div id="skip">click or press any key to skip</div>
<script>
  const end = () => { try { window.close(); } catch (e) { /* the app closes it */ } };
  const want = (location.hash || "").slice(1);
  const pick = want === "film" || want === "neural" ? want : (Math.random() < 0.5 ? "film" : "neural");
  document.body.dataset.splash = pick;
  if (pick === "neural") {
    document.body.classList.add("neural");
    document.getElementById("pic").addEventListener("error", end);
    setTimeout(end, 8000);
  } else {
    const v = document.getElementById("v");
    v.addEventListener("ended", end); v.addEventListener("error", end);
    v.autoplay = true; v.src = "splash.webm";
  }
  document.addEventListener("mousedown", end); document.addEventListener("keydown", end);
  setTimeout(() => document.body.classList.add("hint"), 1500);
</script>
</body></html>
