# bitGen Studio — the bitGen pod image (2.900.0): misc/pod-image built and published as ghcr.io/tim-byte-dev/bitgen-pod,
# the image of the "bitGen Studio pod" RunPod template (lib/podImage.js). Free: GitHub builds it, GitHub's registry keeps it
# (public packages cost nothing). Built again when the image's files or the node pack list change, and every Monday (a
# fresh ComfyUI). Before it is published a pod start is tried with an empty /workspace (what RunPod gives a new pod):
# ComfyUI must land on the pod's disk and load every node pack.
name: pod image

on:
  push:
    branches: [main]
    paths: ["misc/pod-image/**", "lib/nodePacks.json", ".github/workflows/pod-image.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pod-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tim-byte-dev/bitgen-pod

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Room for a 15 GB image (the runner's preinstalled tools out)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af >/dev/null || true
          # the runner's second disk (/mnt) is the larger one: Docker keeps its images there when it has the room
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 40 ]; then
            sudo systemctl stop docker; sudo mkdir -p /mnt/docker
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json; sudo systemctl start docker
          fi
          df -h / /mnt
      - uses: actions/checkout@v5
      - name: RunPod's PyTorch image to start from (the first of bases.txt Docker Hub has)
        id: base
        run: |
          for b in $(grep -v '^\s*#' misc/pod-image/bases.txt | tr -d '\r'); do
            if docker manifest inspect "$b" >/dev/null 2>&1; then echo "base=$b" >> "$GITHUB_OUTPUT"; echo "using $b"; exit 0; fi
            echo "not on Docker Hub: $b"
          done
          echo "none of misc/pod-image/bases.txt is on Docker Hub"; exit 1
      - name: Build
        run: |
          docker build -f misc/pod-image/Dockerfile --build-arg BASE="${{ steps.base.outputs.base }}" \
            --build-arg BITGEN_IMAGE="$IMAGE:latest" -t "$IMAGE:latest" .
          docker images "$IMAGE"
          df -h /
      - name: A first pod start (empty /workspace) - ComfyUI copied in and loading
        run: |
          mkdir -p /tmp/ws
          docker run --rm -e POD_NO_GPU_GB=0 -v /tmp/ws:/workspace "$IMAGE:latest" bash -c '
            set -e
            bash /pre_start.sh
            test -f /workspace/ComfyUI/main.py
            test -x /workspace/ComfyUI/venv/bin/python
            test "$(cat /workspace/ComfyUI/.bitgen_pip_ok)" = "$(git -C /workspace/ComfyUI rev-parse HEAD)"
            test -d /workspace/ComfyUI/custom_nodes/ComfyUI-Manager
            python3 -c "import json; j = json.load(open(\"/workspace/ComfyUI/.bitgen_install.json\")); print(j); assert j[\"by\"] == \"bitGen\"; assert j[\"python\"] == \"/workspace/ComfyUI/venv/bin/python\""
            bash /pre_start.sh | grep -q "already on the pod"
            cd /workspace/ComfyUI && venv/bin/python main.py --cpu --quick-test-for-ci 2>&1 | tail -40
          '
      - name: Publish (latest + the day's tag)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          day="$(date -u +%Y%m%d)"
          docker tag "$IMAGE:latest" "$IMAGE:$day"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$day"
          echo "published $IMAGE:latest and $IMAGE:$day (from ${{ steps.base.outputs.base }})" >> "$GITHUB_STEP_SUMMARY"
