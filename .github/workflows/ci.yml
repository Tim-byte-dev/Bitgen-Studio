# bitGen Studio — the quick tests on every push and pull request (2.477.0).
# scripts/ci-units.sh: every self-contained unit test + the repository checks. The browser suite against stub
# servers (scripts/e2e-stub-test.sh) runs before each release; it needs Playwright and takes an hour or more.
# 2.540.8: Node 22 - jsdom 30 (the unit tests' DOM) needs Node ^22.22 / ^24.15 (its undici 8 calls
# webidl.util.markAsUncloneable, missing in Node 20: the first public runs failed there). The actions' v5 / v6 run on
# Node 24 (GitHub retires Node 20 for actions); the runner pinned to ubuntu-24.04 (ubuntu-latest moves to 26).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/check-gitignore.sh
      - run: bash scripts/ci-units.sh
