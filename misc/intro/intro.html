<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b0907}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 44%,#2a2018 0%,#15100c 55%,#070605 100%)}
#dust{position:absolute;inset:0}
/* 2.751.0 (Tim: "make the new logo the official bitgen logo, we use it for everything that uses a logo"): the official logo has
   its glowing ring (diameter 1332 of the 1080 units) - the logo smaller and higher so the ring clears the name */
#logo{position:absolute;left:50%;top:36%;width:520px;height:520px;margin:-260px 0 0 -260px}
#logo svg{width:100%;height:100%;overflow:visible}
#word{position:absolute;left:0;right:0;top:740px;text-align:center;font-family:"Inter Display","Inter",sans-serif;font-weight:300;font-size:86px;letter-spacing:.18em;color:#f2ede4;opacity:0}
#word b{font-weight:500;color:#f59e2c}
#tag{position:absolute;left:0;right:0;top:860px;text-align:center;font-family:"Inter",sans-serif;font-weight:300;font-size:30px;letter-spacing:.42em;color:#bfb5a6;opacity:0;text-transform:uppercase}
#black{position:absolute;inset:0;background:#000;opacity:1}
.cred{position:absolute;left:0;right:0;text-align:center;font-family:"Inter",sans-serif;font-weight:300;font-size:30px;letter-spacing:.06em;color:#d9d1c4;opacity:0}
.cred b{font-weight:500;color:#f2ede4}
body.splash #logo{top:34.5%}body.splash #word{top:716px}body.splash #tag{top:826px}body.splash #cr1{top:916px!important}body.splash #cr2{top:964px!important}
.cred i{font-style:normal;color:#9d9384;font-size:24px;letter-spacing:.14em;text-transform:uppercase;margin-right:.6em}
</style></head><body>
<div id="bg"></div><canvas id="dust" width="1920" height="1080"></canvas>
<div id="logo"></div>
<div id="word"><b>bitGen</b> Studio</div>
<div id="tag">together · grow · transform</div>
<div class="cred" id="cr1" style="top:952px"><i>Produced and developed by</i><b>Timothy Nolan Paul</b></div>
<div class="cred" id="cr2" style="top:1000px"><i>Programmed by</i><b>Claude Opus 5.5</b></div>
<div id="black"></div>
<script>
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x), seg = (t, a, b) => ease((t - a) / (b - a));
let P = [], L = [], R = [], gL, gR;
async function boot(svgText) {
  const box = document.getElementById("logo"); box.innerHTML = svgText.replace(/<svg[^>]*>/, '<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">');
  const svg = box.querySelector("svg"), paths = [...svg.querySelectorAll("path")];
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  defs.innerHTML = '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  svg.prepend(defs);
  gL = document.createElementNS("http://www.w3.org/2000/svg", "g"); gR = document.createElementNS("http://www.w3.org/2000/svg", "g"); svg.appendChild(gL); svg.appendChild(gR);
  paths.forEach((p) => { const b = p.getBBox(), cx = b.x + b.width / 2; (cx < 540 ? gL : gR).appendChild(p); });
  // the halves: each path's order outward from the middle (pairs draw together)
  const prep = (g) => [...g.children].map((p) => { const b = p.getBBox(), d = Math.abs(b.x + b.width / 2 - 540) + Math.abs(b.y + b.height / 2 - 600) * 0.6, len = p.getTotalLength();
    p.setAttribute("fill", "#eef3f7"); p.setAttribute("stroke", "#f59e2c"); p.setAttribute("stroke-width", "3.2"); p.setAttribute("stroke-linejoin", "round");
    p.style.strokeDasharray = len; return { p, d, len }; }).sort((a, b) => a.d - b.d);
  L = prep(gL); R = prep(gR); P = L.concat(R);
  // 2.751.0: the official logo's ring - drawn round from the top while the lines are drawn, blue like the logo's
  window.RING = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  RING.setAttribute("cx", "540"); RING.setAttribute("cy", "539"); RING.setAttribute("r", "666"); RING.setAttribute("fill", "none");
  RING.setAttribute("stroke", "#7fb3d8"); RING.setAttribute("stroke-width", "7"); RING.setAttribute("transform", "rotate(-90 540 539)");
  RING.style.strokeDasharray = String(2 * Math.PI * 666); svg.insertBefore(RING, gL);
  [L, R].forEach((side) => side.forEach((o, i) => { o.k = i / Math.max(1, side.length - 1); }));
  svg.setAttribute("filter", "url(#glow)");
  // dust: fixed seeds
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  window.D = Array.from({ length: 90 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, r: 0.6 + rnd() * 2.2, v: 6 + rnd() * 18, ph: rnd() * 6.28, a: 0.15 + rnd() * 0.5 }));
}
// 2.701.0 (Tim: "make a splash screen with the video, but add produced and developed by Timothy Nolan Paul, programmed by claude
// opus 5.5 15seconds"): #splash = 15 s - the credits after the name, the logo breathing, the fade at the end
const SPLASH = /splash/.test(location.hash), DUR = SPLASH ? 15 : 10;
if (SPLASH) document.body.classList.add("splash");
function draw(t) {
  // fade in from black, out at the end
  document.getElementById("black").style.opacity = String(Math.max(1 - seg(t, 0, 0.9), seg(t, DUR - 0.7, DUR)));
  if (SPLASH) { const c1 = seg(t, 9.0, 10.2), c2 = seg(t, 9.8, 11.0);
    [["cr1", c1], ["cr2", c2]].forEach(([id, v]) => { const e = document.getElementById(id); e.style.opacity = String(v); e.style.transform = `translateY(${(1 - v) * 14}px)`; }); }
  const c = document.getElementById("dust").getContext("2d"); c.clearRect(0, 0, 1920, 1080);
  D.forEach((d) => { const y = (d.y - d.v * t + 1080) % 1080, x = d.x + Math.sin(t * 0.6 + d.ph) * 14, a = d.a * (0.5 + 0.5 * Math.sin(t * 1.3 + d.ph)) * (0.35 + 0.65 * seg(t, 4.6, 6.2));
    c.fillStyle = `rgba(245,170,80,${a})`; c.beginPath(); c.arc(x, y, d.r, 0, 6.283); c.fill(); });
  // 1 the lines drawn (0.6 - 4.4 s): from the middle outward, the two tigers together
  P.forEach((o) => { const a = 0.6 + o.k * 2.2, f = seg(t, a, a + 1.6); o.p.style.strokeDashoffset = String(o.len * (1 - f)); o.p.style.strokeOpacity = String(f > 0 ? 1 - 0.85 * seg(t, 4.4, 5.6) : 0);
    // 2 filled (3.8 - 5.6 s)
    o.p.style.fillOpacity = String(seg(t, 3.8 + o.k * 0.8, 4.8 + o.k * 0.8)); });
  // the ring (1.0 - 4.6 s), then it stays
  const rf = seg(t, 1.0, 4.6); RING.style.strokeDashoffset = String(2 * Math.PI * 666 * (1 - rf)); RING.style.strokeOpacity = String(rf > 0 ? 0.95 : 0);
  // the glow: up as it fills, a pulse at 5.2 s
  const gl = 0.35 + 0.65 * Math.exp(-Math.pow((t - 5.3) / 0.7, 2)); document.querySelector("#logo svg").style.opacity = String(0.6 + 0.4 * seg(t, 0.6, 2)); document.querySelector("feGaussianBlur").setAttribute("stdDeviation", String(3 + 9 * gl * seg(t, 3.5, 5)));
  // 3 the butterfly (5.4 - 8 s): two slow wing beats, the halves folding about the middle; a little lift
  const w = seg(t, 5.4, 5.8) * (1 - seg(t, 7.6, 8.2)), beat = Math.pow(Math.sin(Math.max(0, t - 5.4) * Math.PI / 1.1), 2) * w, sx = 1 - 0.22 * beat;
  gL.setAttribute("transform", `translate(540 0) scale(${sx} 1) translate(-540 0)`); gR.setAttribute("transform", `translate(540 0) scale(${sx} 1) translate(-540 0)`);
  const lift = -18 * seg(t, 5.4, 8) - (SPLASH ? 6 * Math.sin(Math.max(0, t - 8) * 1.1) * seg(t, 8, 9) : 0); document.getElementById("logo").style.transform = `translateY(${lift}px) scale(${1 + 0.04 * seg(t, 0, DUR)})`;
  // 4 the name + its meaning (6.6 - 8.4 s)
  const wd = seg(t, 6.6, 7.8), tg = seg(t, 7.4, 8.6);
  const W = document.getElementById("word"); W.style.opacity = String(wd); W.style.transform = `translateY(${(1 - wd) * 24}px)`; W.style.letterSpacing = `${0.3 - 0.12 * wd}em`;
  const T = document.getElementById("tag"); T.style.opacity = String(tg * 0.9); T.style.transform = `translateY(${(1 - tg) * 16}px)`;
}
</script></body></html>
